[package]
name = "django-rsws"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "django_rsws"
crate-type = ["cdylib"]

[dependencies]
axum = { version = "0.8.6", features = ["ws"] }
axum-extra = { version = "0.12.1", features = ["typed-header"] }
headers = "0.4.1"
pyo3 = "0.25.0"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "tracing"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[tool.maturin]
python-source = "py"
