[package]
name = "django-wsrs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "django_wsrs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["ws"] }
dashmap = "6.1"
axum-extra = { version = "0.12.1", features = ["typed-header"] }
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
fastwebsockets = { version = "0.10.0", features = ["unstable-split", "upgrade", "with_axum"] }
futures-util = { version = "0.3.31", features = ["sink"] }
headers = "0.4.1"
log = "0.4.29"
pyo3 = "0.27.1"
pyo3-log = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "signal", "tracing"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[tool.maturin]
python-source = "py"
