config:
  target: "http://localhost:6969/chat"
  ws:
    followRedirects: true
  phases:
    - duration: 20 # Ramp-up phase (seconds)
      arrivalRate: 10 # Start with 10 new VUs per second
      name: Warm-up
    - duration: 20
      arrivalRate: 50
      rampTo: 100
      name: Ramp-up
    - duration: 20
      arrivalRate: 400
      name: Peak Load

scenarios:
  - engine: ws
    flow:
      # - send: "Hello from artilery"
      # # - think: 1
      #
      # # Optional: wait for a server message
      # - wait:
      #     - match:
      #         payload: "Hello from artilery"

      - loop:
          - send: "Load test message {{ $loopCount }}"
          - wait:
              - match:
                  payload: "Load test message {{ $loopCount }}"
        count: 10
